name: pr-check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    # routine は claude/ ブランチにしか push できないので、AI の PR はここで必ず検査される。
    # 作者やラベルでは判定しない: routine の GitHub 操作は本人の資格情報に差し替えて送られるため、
    # AI の PR も作者が本人になりうる
    if: startsWith(github.event.pull_request.head.ref, 'claude/')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check PR scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # 検査スクリプトは base 側のものを使う。PR が自分の検査を書き換えて通るのを防ぐ
        run: |
          git show "$BASE_SHA:.github/scripts/check-pr-scope.sh" > "$RUNNER_TEMP/check-pr-scope.sh"
          git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA" | bash "$RUNNER_TEMP/check-pr-scope.sh"
